<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="The requested RonikCloud page could not be found.">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#1B48A5">
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png?v=2">
  <title>Page Not Found | RonikCloud</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f7f9;
      color: #172033;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      max-width: 420px;
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 30px;
      font-weight: 700;
    }

    p {
      margin: 0 0 24px;
      line-height: 1.5;
      color: #4b5565;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 18px;
      border-radius: 10px;
      background: #174fa9;
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
    }

    a:hover { background: #123e85; }
    a:focus-visible { outline: 3px solid #2f6ed0; outline-offset: 4px; }
    ::selection { background: #bed5ff; color: #07152d; }

    @media (prefers-color-scheme: dark) {
      :root {
        background: #101623;
        color: #f5f7fb;
      }

      p {
        color: #b7c0d1;
      }
      a { background: #8cbaff; color: #07152d; }
      a:hover { background: #bed5ff; }
      a:focus-visible { outline-color: #8cbaff; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Page not found</h1>
    <p>The requested page does not exist.</p>
    <a href="/">Open RonikCloud</a>
  </main>
</body>
</html>
